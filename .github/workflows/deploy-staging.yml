name: Deploy — Staging

# Fires on every commit that lands on the `staging` branch.
# Typically triggered by a PR merge from `develop` → `staging`.

on:
  push:
    branches: [staging]

# Never cancel a running staging deploy — let it finish so we don't
# leave the environment in a half-deployed state.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging      # Pulls secrets from GitHub Environment "staging"
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (staging)
        run: npm run build
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ENABLE_DEMO_AUTH:  'true'
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}

      # ─────────────────────────────────────────────────────────────────────
      # REPLACE THIS STEP with your actual hosting provider command.
      #
      # Examples:
      #   Fly.io:   flyctl deploy --remote-only --app shipstack-staging
      #   Railway:  railway up --service shipstack-staging
      #   Render:   curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}
      # ─────────────────────────────────────────────────────────────────────
      - name: Deploy to host
        run: |
          echo "Replace this step with your host deploy command."
          echo "e.g. flyctl deploy --remote-only --app shipstack-staging"

      - name: Notify Slack on success
        if: success() && secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ *Staging deploy succeeded* — `${{ github.ref_name }}` @ `${{ github.sha }}`"
            }

      - name: Notify Slack on failure
        if: failure() && secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "🚨 *Staging deploy FAILED* — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }
