# Shipstack production nginx config (TLS).
#
# Usage:
#   1. Obtain certs: certbot certonly --standalone -d <your-domain>
#   2. Replace <your-domain> below.
#   3. Mount this file instead of nginx.conf in docker-compose.production.yml:
#        - ./nginx.ssl.conf:/etc/nginx/conf.d/default.conf:ro
#        - /etc/letsencrypt:/etc/letsencrypt:ro
#      and expose port 443 on the nginx-proxy service.
#
# For local/non-TLS deployments keep using nginx.conf.

# Rate limiting zones (shared across locations)
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=telemetry:10m rate=150r/m;

upstream shipstack-node {
    server shipstack-node:3000;
}

upstream frappe-backend {
    server backend:8000;
}

upstream frappe-websocket {
    server websocket:9000;
}

# HTTP -> HTTPS redirect (keep ACME challenge reachable for cert renewal)
server {
    listen 80;
    server_name <your-domain>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name <your-domain>;

    ssl_certificate     /etc/letsencrypt/live/<your-domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<your-domain>/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS (6 months; raise to 2y + preload once stable)
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 12m;  # DMS uploads are capped at 10MB by multer

    # Serve static assets directly from the shared volume
    location /assets {
        root /home/frappe/frappe-bench/sites;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Route Frappe Desk, login page, files and core API calls directly to Frappe backend
    location ~ ^/(app|login|desk|api/method/frappe|files) {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://frappe-backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route socket.io connections to Frappe realtime websocket
    location /socket.io {
        proxy_pass http://frappe-websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Auth endpoints: tight brute-force budget
    location = /api/frappe/login {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://shipstack-node;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Telemetry: higher-frequency budget
    location = /api/telemetry {
        limit_req zone=telemetry burst=30 nodelay;
        proxy_pass http://shipstack-node;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Remaining API routes
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://shipstack-node;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA and everything else
    location / {
        proxy_pass http://shipstack-node;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
